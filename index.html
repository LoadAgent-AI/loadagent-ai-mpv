<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoadAgent AI - Autonomous Dispatcher Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Clerk JS SDK -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_dG91Y2hpbmctb3J5eC02OTI0LmNsZXJrLmFjY291bnRzLmRldiQ"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
  ></script>

  <style>
    /* Dark Theme adjustments for Clerk embedded component */
    .cl-card {
      background-color: #1e293b !important;
      border: 1px solid #334155 !important;
      color: #f8fafc !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- ========================================== -->
  <!-- SECTION 1: SIGNED-OUT VIEW (Sign In / Sign Up) -->
  <!-- ========================================== -->
  <div id="signed-out-view" class="w-full max-w-md flex flex-col items-center justify-center space-y-6">
    <div class="text-center">
      <h1 class="text-3xl font-bold text-emerald-400">LoadAgent AI</h1>
      <p class="text-sm text-slate-400 mt-1">Autonomous Email Negotiation for US Fleets</p>
    </div>

    <!-- Direct Email / Password / Google Login Component Mounted Here -->
    <div id="clerk-auth-container" class="w-full flex justify-center min-h-[400px]">
      <div class="flex items-center justify-center text-slate-400 text-sm">
        <svg class="animate-spin h-5 w-5 mr-3 text-emerald-400" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Loading Secure Sign In / Sign Up...
      </div>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- SECTION 2: SIGNED-IN VIEW (Current Parse Screen / Future Dashboard) -->
  <!-- ========================================== -->
  <div id="signed-in-view" class="max-w-4xl w-full mx-auto space-y-6 hidden">
    
    <!-- Top Bar Header -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">LoadAgent AI</h1>
        <p class="text-sm text-slate-400">Autonomous Email Negotiation for US Fleets</p>
      </div>

      <div class="flex items-center gap-3">
        <span class="bg-emerald-500/10 text-emerald-400 text-xs px-3 py-1.5 rounded-full border border-emerald-500/20 font-medium">
          Live AI Engine Active
        </span>
        <!-- User Profile & Sign Out Controls -->
        <div id="user-button"></div>
      </div>
    </header>

    <!-- Email Parsing Box (Filhal ke liye) -->
    <div class="bg-slate-800/50 border border-slate-700/50 p-6 rounded-xl space-y-4">
      <h2 class="text-lg font-semibold text-slate-200">1. Paste Broker Load Email</h2>
      <textarea id="email-text" class="w-full h-32 bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-emerald-500 text-slate-100" placeholder="Paste incoming broker email text here..."></textarea>
      <button id="parse-btn" class="bg-emerald-500 text-slate-950 font-bold px-5 py-2 rounded-lg hover:bg-emerald-400 text-sm transition">
        Parse & Negotiate Load
      </button>

      <!-- Counter Offer Result Container -->
      <div id="output-container" class="hidden mt-4 p-4 bg-slate-900/80 border border-emerald-500/30 rounded-lg text-sm text-slate-200 space-y-2">
        <p class="font-bold text-emerald-400">AI Generated Counter-Offer Reply:</p>
        <p id="output-text" class="whitespace-pre-line"></p>
      </div>
    </div>

  </div>


  <!-- ========================================== -->
  <!-- SECTION 3: CLERK AUTH & WORKFLOW SCRIPT -->
  <!-- ========================================== -->
  <script>
    const clerkPubKey = "pk_test_dG91Y2hpbmctb3J5eC02OTI0LmNsZXJrLmFjY291bnRzLmRldiQ";

    // Initialize Clerk Engine
    window.addEventListener('load', async () => {
      if (window.Clerk) {
        await Clerk.load({ publishableKey: clerkPubKey });

        const signedOutView = document.getElementById('signed-out-view');
        const signedInView = document.getElementById('signed-in-view');
        const authContainer = document.getElementById('clerk-auth-container');

        function updateUI(user) {
          if (user) {
            signedOutView.classList.add('hidden');
            signedInView.classList.remove('hidden');
            Clerk.mountUserButton(document.getElementById('user-button'));
          } else {
            signedInView.classList.add('hidden');
            signedOutView.classList.remove('hidden');
            authContainer.innerHTML = ''; // Clear loading text
            Clerk.mountSignIn(authContainer); // Direct embedded Sign In + Sign Up form
          }
        }

        // Initial Auth State Check
        updateUI(Clerk.user);

        // Auth State Listener
        Clerk.addListener(({ user }) => {
          updateUI(user);
        });
      }
    });

    // Simple Counter-Offer Generator Handler
    document.getElementById('parse-btn').addEventListener('click', () => {
      const input = document.getElementById('email-text').value;
      const outputContainer = document.getElementById('output-container');
      const outputText = document.getElementById('output-text');

      if (!input.trim()) {
        alert("Please paste a broker email first!");
        return;
      }

      outputContainer.classList.remove('hidden');
      outputText.innerText = "Hi Broker,\n\nThanks for reaching out regarding this load. Based on our current lane rates and fuel costs, our best rate to take this immediately is $2,400 (all-in).\n\nLet us know if you can update the rate confirmation so we can dispatch the driver.\n\nBest regards,\nDispatch Team";
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoadAgent AI - Autonomous Dispatcher Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- ========================================== -->
  <!-- SECTION 1: SIGNED-OUT VIEW (Login / Signup) -->
  <!-- ========================================== -->
  <div id="signed-out-view" class="w-full max-w-md bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-xl space-y-6">
    <div class="text-center">
      <h1 class="text-3xl font-bold text-emerald-400">LoadAgent AI</h1>
      <p class="text-sm text-slate-400 mt-1">Autonomous Email Negotiation for US Fleets</p>
    </div>

    <!-- Auth Toggle Tabs -->
    <div class="flex border-b border-slate-700">
      <button id="tab-signin" class="w-1/2 py-2 text-center text-sm font-semibold border-b-2 border-emerald-400 text-emerald-400">
        Sign In
      </button>
      <button id="tab-signup" class="w-1/2 py-2 text-center text-sm font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200">
        Sign Up
      </button>
    </div>

    <!-- Sign In Form -->
    <form id="signin-form" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
        <input type="email" required placeholder="dispatcher@fleet.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
        <input type="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>
      <button type="submit" class="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-lg hover:bg-emerald-400 transition text-sm">
        Sign In
      </button>
    </form>

    <!-- Sign Up Form (Hidden by default) -->
    <form id="signup-form" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Full Name</label>
        <input type="text" required placeholder="Zain Ul Abdin" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
        <input type="email" required placeholder="dispatcher@fleet.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
        <input type="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>
      <button type="submit" class="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-lg hover:bg-emerald-400 transition text-sm">
        Create Account
      </button>
    </form>

    <div class="relative flex py-1 items-center">
      <div class="flex-grow border-t border-slate-700"></div>
      <span class="flex-shrink mx-3 text-xs text-slate-500">OR</span>
      <div class="flex-grow border-t border-slate-700"></div>
    </div>

    <!-- Google Login Button -->
    <button id="google-btn" class="w-full bg-slate-900 border border-slate-700 hover:bg-slate-700/50 text-slate-200 font-medium py-2.5 rounded-lg flex items-center justify-center gap-2 text-sm transition">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>
  </div>


  <!-- ========================================== -->
  <!-- SECTION 2: SIGNED-IN VIEW (Dashboard/Parser) -->
  <!-- ========================================== -->
  <div id="signed-in-view" class="max-w-4xl w-full mx-auto space-y-6 hidden">
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">LoadAgent AI</h1>
        <p class="text-sm text-slate-400">Autonomous Email Negotiation for US Fleets</p>
      </div>
      <button id="logout-btn" class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-700">
        Sign Out
      </button>
    </header>

    <div class="bg-slate-800/50 border border-slate-700/50 p-6 rounded-xl space-y-4">
      <h2 class="text-lg font-semibold text-slate-200">1. Paste Broker Load Email</h2>
      <textarea id="email-text" class="w-full h-32 bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="Paste incoming broker email text here..."></textarea>
      <button id="parse-btn" class="bg-emerald-500 text-slate-950 font-bold px-5 py-2 rounded-lg hover:bg-emerald-400 text-sm transition">
        Parse & Negotiate Load
      </button>

      <!-- Complete Professional Counter Offer -->
      <div id="output-container" class="hidden mt-4 p-5 bg-slate-900/90 border border-emerald-500/40 rounded-lg text-sm text-slate-200 space-y-3">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <span class="font-bold text-emerald-400">AI Generated Counter-Offer Reply</span>
          <span class="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded">Ready to Send</span>
        </div>
        <div id="output-text" class="whitespace-pre-line text-slate-300 leading-relaxed font-mono text-xs"></div>
      </div>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- SECTION 3: JAVASCRIPT LOGIC -->
  <!-- ========================================== -->
  <script>
    const tabSignin = document.getElementById('tab-signin');
    const tabSignup = document.getElementById('tab-signup');
    const signinForm = document.getElementById('signin-form');
    const signupForm = document.getElementById('signup-form');

    const signedOutView = document.getElementById('signed-out-view');
    const signedInView = document.getElementById('signed-in-view');
    const logoutBtn = document.getElementById('logout-btn');

    // Tab Switching Logic
    tabSignin.addEventListener('click', () => {
      tabSignin.className = "w-1/2 py-2 text-center text-sm font-semibold border-b-2 border-emerald-400 text-emerald-400";
      tabSignup.className = "w-1/2 py-2 text-center text-sm font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200";
      signinForm.classList.remove('hidden');
      signupForm.classList.add('hidden');
    });

    tabSignup.addEventListener('click', () => {
      tabSignup.className = "w-1/2 py-2 text-center text-sm font-semibold border-b-2 border-emerald-400 text-emerald-400";
      tabSignin.className = "w-1/2 py-2 text-center text-sm font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200";
      signupForm.classList.remove('hidden');
      signinForm.classList.add('hidden');
    });

    // Form Submit Handlers
    const loginUser = (e) => {
      e.preventDefault();
      signedOutView.classList.add('hidden');
      signedInView.classList.remove('hidden');
    };

    signinForm.addEventListener('submit', loginUser);
    signupForm.addEventListener('submit', loginUser);
    document.getElementById('google-btn').addEventListener('click', () => {
      signedOutView.classList.add('hidden');
      signedInView.classList.remove('hidden');
    });

    logoutBtn.addEventListener('click', () => {
      signedInView.classList.add('hidden');
      signedOutView.classList.remove('hidden');
    });

    // Detailed Counter Offer Generator
    document.getElementById('parse-btn').addEventListener('click', () => {
      const input = document.getElementById('email-text').value;
      if (!input.trim()) return alert("Please paste a broker email first!");
      
      document.getElementById('output-container').classList.remove('hidden');
      document.getElementById('output-text').innerText = 
`Subject: Re: Rate Confirmation / Load Negotiation Request

Hi Broker Team,

Thank you for reaching out regarding this lane. 

Our dispatch team has reviewed the load details and current market capacity for this lane. Based on current fuel rates and immediate truck availability, we can book and dispatch this driver immediately for $2,650 (all-in).

Load Details Confirmed:
- Driver: Ready for immediate dispatch
- Rate Counter: $2,650 (All-In)

Please send over the updated Rate Confirmation to this email so we can sign and confirm lock-in right away.

Best regards,
LoadAgent AI Dispatch Desk`;
    });
  </script>
</body>
</html>

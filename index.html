<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoadAgent AI - Autonomous Dispatcher Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Clerk Script -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_dG91Y2hpbmctb3J5eC02OTI0LmNsZXJrLmFjY291bnRzLmRldiQ"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Header -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">LoadAgent AI</h1>
        <p class="text-sm text-slate-400">Autonomous Email Negotiation for US Fleets</p>
      </div>
      
      <!-- Auth Section -->
      <div class="flex items-center gap-4">
        <span class="bg-emerald-500/10 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-500/20">
          Live AI Engine Active
        </span>
        <div id="user-button"></div>
        <div id="auth-buttons">
          <button id="sign-in-btn" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-4 py-2 rounded-lg font-semibold text-sm transition">
            Sign In / Sign Up
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content / Dispatch Parser Box -->
    <div class="bg-slate-800/50 border border-slate-700/50 p-6 rounded-xl space-y-4">
      <h2 class="text-lg font-semibold text-slate-200">1. Paste Broker Load Email</h2>
      <textarea class="w-full h-32 bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-emerald-500" placeholder="Paste incoming broker email text here..."></textarea>
      <button class="bg-emerald-500 text-slate-950 font-bold px-5 py-2.5 rounded-lg hover:bg-emerald-400 transition">
        Parse & Negotiate Load
      </button>
    </div>

  </div>

  <!-- Clerk Initialization Script -->
  <script>
    window.addEventListener('load', async () => {
      const clerkPubKey = "pk_test_dG91Y2hpbmctb3J5eC02OTI0LmNsZXJrLmFjY291bnRzLmRldiQ";
      
      if (window.Clerk) {
        await Clerk.load({ publishableKey: clerkPubKey });
        
        if (Clerk.user) {
          document.getElementById('auth-buttons').style.display = 'none';
          Clerk.mountUserButton(document.getElementById('user-button'));
        } else {
          document.getElementById('auth-buttons').style.display = 'block';
          document.getElementById('sign-in-btn').addEventListener('click', () => {
            Clerk.openSignIn();
          });
        }
      }
    });
  </script>
</body>
</html>

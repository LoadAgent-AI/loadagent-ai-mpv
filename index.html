<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoadAgent AI - Autonomous Dispatcher Copilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center border-b border-slate-700 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">LoadAgent AI</h1>
        <p class="text-sm text-slate-400">Autonomous Email Negotiation for US Fleets</p>
      </div>
      <span class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-xs font-semibold border border-emerald-500/20">
        Live AI Engine Active
      </span>
    </header>

    <!-- Dispatch Parser Box -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-semibold text-slate-200">1. Paste Broker Load Email</h2>
        <button onclick="fillSample()" class="text-xs text-emerald-400 underline hover:text-emerald-300">Insert Sample Email</button>
      </div>
      <textarea id="emailInput" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500" placeholder="Paste incoming broker email text here..."></textarea>
      
      <button onclick="parseEmail()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-5 py-2.5 rounded-lg text-sm transition">
        Parse & Negotiate Load
      </button>
    </div>

    <!-- Live Analysis Dashboard -->
    <div id="results" class="hidden bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-4">
      <h2 class="text-lg font-semibold text-slate-200">2. AI Dynamic Rate Optimization</h2>
      
      <!-- Extracted Metadata Badges -->
      <div class="flex flex-wrap gap-2 text-xs font-medium">
        <span class="bg-slate-900 px-3 py-1 rounded border border-slate-700 text-slate-300">Load ID: <strong id="extractedLoadId" class="text-emerald-400">N/A</strong></span>
        <span class="bg-slate-900 px-3 py-1 rounded border border-slate-700 text-slate-300">Route: <strong id="extractedRoute" class="text-emerald-400">N/A</strong></span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
          <p class="text-xs text-slate-400">Broker Initial Offer</p>
          <p id="offerRate" class="text-xl font-bold text-slate-100">$0</p>
        </div>
        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
          <p class="text-xs text-slate-400">Estimated Lane Avg</p>
          <p id="datRate" class="text-xl font-bold text-blue-400">$0</p>
        </div>
        <div class="bg-slate-900 p-4 rounded-lg border border-emerald-500/30">
          <p class="text-xs text-slate-400">AI Counter Offer (+15%)</p>
          <p id="counterRate" class="text-xl font-bold text-emerald-400">$0</p>
        </div>
      </div>

      <!-- Generated Counter Email -->
      <div class="space-y-2">
        <p class="text-sm font-medium text-slate-300">Generated Dynamic Email Response:</p>
        <div id="emailOutput" class="bg-slate-900 p-4 rounded-lg border border-slate-700 text-xs font-mono text-slate-300 whitespace-pre-wrap"></div>
      </div>

      <button onclick="copyEmail()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">
        Copy Counter Offer Email
      </button>
    </div>

  </div>

  <script>
    function fillSample() {
      document.getElementById('emailInput').value = "Hi Dispatch, load #9942 available from Atlanta GA to Chicago IL paying $1,800. Pickup tomorrow morning. Let me know if you have a driver.";
    }

    function parseEmail() {
      const text = document.getElementById('emailInput').value;
      if (!text.trim()) {
        alert("Please paste a broker email first!");
        return;
      }

      // Regex Extraction Rules
      const priceMatch = text.match(/\$\s*([0-9,]+)/) || text.match(/([0-9,]+)\s*(dollars|usd|paying)/i);
      const loadIdMatch = text.match(/(?:load|ref|#)\s*[:#]?\s*([a-z0-9-]+)/i);
      const routeMatch = text.match(/([A-Z][a-zA-Z\s]+,\s*[A-Z]{2})\s*(?:to|->|-)\s*([A-Z][a-zA-Z\s]+,\s*[A-Z]{2})/i);

      // Parse Values
      let rawPrice = priceMatch ? parseInt(priceMatch[1].replace(/,/g, '')) : 2000;
      let loadId = loadIdMatch ? loadIdMatch[1] : "#" + Math.floor(1000 + Math.random() * 9000);
      let route = routeMatch ? `${routeMatch[1]} to ${routeMatch[2]}` : "Extracted Route";

      // Calculations
      let laneAvg = Math.round(rawPrice * 1.08);
      let counterOffer = Math.round(rawPrice * 1.15);

      // UI Updates
      document.getElementById('extractedLoadId').innerText = loadId;
      document.getElementById('extractedRoute').innerText = route;
      document.getElementById('offerRate').innerText = "$" + rawPrice.toLocaleString();
      document.getElementById('datRate').innerText = "$" + laneAvg.toLocaleString();
      document.getElementById('counterRate').innerText = "$" + counterOffer.toLocaleString();

      document.getElementById('emailOutput').innerText = 
`Subject: Re: Load ${loadId} - Counter Offer

Hi Broker,

Thank you for reaching out regarding Load ${loadId} (${route}). 
Based on our current rate calculations and lane benchmarks, our rate for immediate dispatch is $${counterOffer.toLocaleString()}.

Please send the updated rate confirmation if approved so we can assign our driver right away.

Best regards,
LoadAgent Dispatcher Copilot`;

      document.getElementById('results').classList.remove('hidden');
    }

    function copyEmail() {
      const text = document.getElementById('emailOutput').innerText;
      navigator.clipboard.writeText(text);
      alert("Counter offer email copied to clipboard!");
    }
  </script>
</body>
</html>

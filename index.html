<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoadAgent AI - Autonomous Dispatcher Copilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center border-b border-slate-700 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">LoadAgent AI</h1>
        <p class="text-sm text-slate-400">Autonomous Email Negotiation for US Fleets</p>
      </div>
      <span class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-xs font-semibold border border-emerald-500/20">
        Agent Active • Demo Mode
      </span>
    </header>

    <!-- Dispatch Parser Box -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-4">
      <h2 class="text-lg font-semibold text-slate-200">1. Paste Broker Load Email</h2>
      <textarea id="emailInput" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500" placeholder="Paste incoming broker email text here..."></textarea>
      
      <button onclick="parseEmail()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-5 py-2.5 rounded-lg text-sm transition">
        Parse & Negotiate Load
      </button>
    </div>

    <!-- Live Analysis Dashboard -->
    <div id="results" class="hidden bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-4">
      <h2 class="text-lg font-semibold text-slate-200">2. AI Rate Optimization</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
          <p class="text-xs text-slate-400">Broker Initial Offer</p>
          <p id="offerRate" class="text-xl font-bold text-slate-100">$0</p>
        </div>
        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
          <p class="text-xs text-slate-400">DAT Lane Avg Rate</p>
          <p id="datRate" class="text-xl font-bold text-blue-400">$0</p>
        </div>
        <div class="bg-slate-900 p-4 rounded-lg border border-emerald-500/30">
          <p class="text-xs text-slate-400">AI Counter Offer (+15%)</p>
          <p id="counterRate" class="text-xl font-bold text-emerald-400">$0</p>
        </div>
      </div>

      <!-- Generated Counter Email -->
      <div class="space-y-2">
        <p class="text-sm font-medium text-slate-300">Generated Email Response:</p>
        <div id="emailOutput" class="bg-slate-900 p-4 rounded-lg border border-slate-700 text-xs font-mono text-slate-300 whitespace-pre-wrap"></div>
      </div>

      <button onclick="alert('Counter offer email sent to broker!')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">
        Approve & Send Counter Offer
      </button>
    </div>

  </div>

  <script>
    function parseEmail() {
      const input = document.getElementById('emailInput').value || "Load #8821: Chicago IL to Dallas TX. Dry Van. Offer: $2,100.";
      
      document.getElementById('offerRate').innerText = "$2,100";
      document.getElementById('datRate').innerText = "$2,350";
      document.getElementById('counterRate').innerText = "$2,415";

      document.getElementById('emailOutput').innerText = 
`Subject: Re: Load #8821 - Counter Offer

Hi Broker,

Thanks for reaching out regarding Load #8821 (Chicago IL to Dallas TX). 
Based on current DAT lane benchmarks, our rate for immediate dispatch on this lane is $2,415.

Please confirm if you can update the rate confirmation so we can assign our driver.

Best regards,
LoadAgent Dispatcher Copilot`;

      document.getElementById('results').classList.remove('hidden');
    }
  </script>
</body>
</html>

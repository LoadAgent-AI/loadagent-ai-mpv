<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - LoadAgent-AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl w-full max-w-md space-y-6">
    
    <!-- Logo & Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-400 text-xl font-bold border border-emerald-500/30">
        🚛
      </div>
      <h1 class="text-xl font-extrabold text-white">LoadAgent-AI</h1>
      <p class="text-xs text-slate-400">Zero-friction mobile dispatching suite</p>
    </div>

    <!-- Toggle Tabs -->
    <div class="grid grid-cols-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
      <button type="button" id="tab-signin" onclick="switchTab('signin')" class="py-2 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 transition">
        Sign In
      </button>
      <button type="button" id="tab-signup" onclick="switchTab('signup')" class="py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">
        Sign Up
      </button>
    </div>

    <!-- Google Auth Button -->
    <button type="button" id="google-auth-btn" class="w-full bg-slate-950 hover:bg-slate-800 border border-slate-700 text-white font-semibold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2.5 transition">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.1 8.9 5 12 5z"/>
        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
        <path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.7s.2-2 .4-2.7L1.6 6.4C.6 8.4 0 10.6 0 13s.6 4.6 1.6 6.6l3.7-2.9z"/>
        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5.3L1.6 15.9C3.5 19.7 7.4 23 12 23z"/>
      </svg>
      Continue with Google
    </button>

    <div class="relative flex py-1 items-center">
      <div class="flex-grow border-t border-slate-800"></div>
      <span class="flex-shrink mx-3 text-[10px] text-slate-500 uppercase">Or email</span>
      <div class="flex-grow border-t border-slate-800"></div>
    </div>

    <!-- Form -->
    <div class="space-y-4">
      <div id="name-field-wrap" class="hidden space-y-1">
        <label class="block text-[11px] text-slate-400">Full Name / Agency</label>
        <input type="text" id="user-name" placeholder="Zain Ul Abdin" class="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-xl px-3 py-2 text-sm text-white outline-none">
      </div>

      <div class="space-y-1">
        <label class="block text-[11px] text-slate-400">Email Address</label>
        <input type="email" id="user-email" placeholder="user@loadagent-ai.com" class="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-xl px-3 py-2 text-sm text-white outline-none">
      </div>

      <div class="space-y-1">
        <label class="block text-[11px] text-slate-400">Password</label>
        <input type="password" id="user-pass" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-xl px-3 py-2 text-sm text-white outline-none">
      </div>

      <button type="button" id="submit-auth-btn" onclick="handleAuthSubmit()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl text-sm transition">
        Sign In to Dashboard
      </button>
    </div>

    <!-- Reviewer Bypass -->
    <div class="text-center pt-2">
      <button type="button" onclick="bypassLogin()" class="text-[11px] text-sky-400 hover:text-sky-300 font-semibold transition">
        ⚡ Quick Demo Access (For YC Reviewers)
      </button>
    </div>

  </div>

  <script>
    let isSignup = false;

    function switchTab(mode) {
      isSignup = (mode === 'signup');
      const signinBtn = document.getElementById('tab-signin');
      const signupBtn = document.getElementById('tab-signup');
      const nameWrap = document.getElementById('name-field-wrap');
      const submitBtn = document.getElementById('submit-auth-btn');

      if (isSignup) {
        signupBtn.className = "py-2 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 transition";
        signinBtn.className = "py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
        nameWrap.classList.remove('hidden');
        submitBtn.textContent = "Create Account & Start";
      } else {
        signinBtn.className = "py-2 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 transition";
        signupBtn.className = "py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
        nameWrap.classList.add('hidden');
        submitBtn.textContent = "Sign In to Dashboard";
      }
    }

    function handleAuthSubmit() {
      const email = document.getElementById('user-email').value.trim();
      const pass = document.getElementById('user-pass').value.trim();
      if (!email || !pass) {
        alert("⚠️ Please enter email and password!");
        return;
      }

      const userSession = {
        email: email,
        name: isSignup ? document.getElementById('user-name').value.trim() : "Zain Ul Abdin",
        isLoggedIn: true
      };

      localStorage.setItem('loadagent_session', JSON.stringify(userSession));
      window.location.href = "index.html"; // Redirect to main app dashboard
    }

    function bypassLogin() {
      const demoSession = { email: "reviewer@loadagent-ai.com", name: "YC Reviewer", isLoggedIn: true };
      localStorage.setItem('loadagent_session', JSON.stringify(demoSession));
      window.location.href = "index.html";
    }
    const GOOGLE_CLIENT_ID = "447380316463-hc9hadn3fdkko7our9f3mi7um1minaps.apps.googleusercontent.com";

function decodeJwtPayload(token) {
  const base64Url = token.split('.')[1];
  const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
  const jsonPayload = decodeURIComponent(
    atob(base64)
      .split('')
      .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
      .join('')
  );
  return JSON.parse(jsonPayload);
}

function handleGoogleCredentialResponse(response) {
  try {
    const payload = decodeJwtPayload(response.credential);
    localStorage.setItem('loadagent_session', JSON.stringify({
      isLoggedIn: true,
      provider: 'google',
      name: payload.name || 'Google User',
      email: payload.email || '',
      picture: payload.picture || '',
      ts: Date.now()
    }));
    window.location.href = "index.html";
  } catch (err) {
    console.error("Google login error:", err);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (window.google && google.accounts && google.accounts.id) {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleCredentialResponse
    });
  }

  const googleBtn = document.getElementById('google-auth-btn');
  if (googleBtn) {
    googleBtn.addEventListener('click', () => {
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.prompt();
      } else {
        alert("Google sign-in script is still loading. Please try again.");
      }
    });
  }
});
  </script>
</body>
  </html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — LoadAgent-AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-5">
    <!-- Header -->
    <div class="text-center space-y-1.5">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-400 text-2xl">
        🚚
      </div>
      <h1 class="text-xl font-extrabold text-white">LoadAgent-AI</h1>
      <p id="auth-subtitle" class="text-xs text-slate-400">Sign in to your dispatching workspace</p>
    </div>

    <!-- Sign In / Sign Up Tabs -->
    <div class="grid grid-cols-2 gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
      <button
        type="button"
        id="tab-signin"
        onclick="switchTab('signin')"
        class="py-2 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 transition"
      >
        Sign In
      </button>
      <button
        type="button"
        id="tab-signup"
        onclick="switchTab('signup')"
        class="py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition"
      >
        Sign Up
      </button>
    </div>

    <!-- Google Sign-In Button -->
    <button
      type="button"
      id="google-auth-btn"
      class="w-full py-2.5 px-4 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-700 text-xs font-semibold text-white flex items-center justify-center gap-2.5 transition"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.4 8.9 5 12 5z"/>
        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
        <path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.2s.2-1.5.4-2.2L1.6 7.4C.6 9.4 0 11.6 0 14s.6 4.6 1.6 6.6l3.7-2.9z"/>
        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3.1l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5.3L1.6 15.9C3.5 20.1 7.4 23 12 23z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <!-- Hidden GSI Container Fallback -->
    <div id="gsi-render-target" class="hidden"></div>

    <!-- Divider -->
    <div class="relative flex py-0.5 items-center">
      <div class="flex-grow border-t border-slate-800"></div>
      <span class="flex-shrink mx-3 text-[10px] uppercase tracking-wider text-slate-500">Or email</span>
      <div class="flex-grow border-t border-slate-800"></div>
    </div>

    <!-- Email / Password Form -->
    <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-3.5">
      <div id="name-field-wrap" class="hidden space-y-1">
        <label class="block text-[11px] text-slate-400">Full Name / Agency</label>
        <input
          type="text"
          id="user-name"
          placeholder="Zain Ul Abdin"
          class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white focus:outline-none focus:border-emerald-500"
        />
      </div>

      <div class="space-y-1">
        <label class="block text-[11px] text-slate-400">Email Address</label>
        <input
          type="email"
          id="user-email"
          required
          placeholder="you@company.com"
          class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white focus:outline-none focus:border-emerald-500"
        />
      </div>

      <div class="space-y-1">
        <label class="block text-[11px] text-slate-400">Password</label>
        <input
          type="password"
          id="user-pass"
          required
          placeholder="••••••••"
          class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white focus:outline-none focus:border-emerald-500"
        />
      </div>

      <button
        type="submit"
        id="submit-auth-btn"
        class="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-extrabold transition"
      >
        Sign In to Dashboard
      </button>
    </form>

    <!-- Demo Access -->
    <div class="text-center pt-1">
      <button
        type="button"
        onclick="demoLogin()"
        class="text-[11px] font-semibold text-sky-400 hover:text-sky-300 transition"
      >
        ⚡ Demo Access
      </button>
    </div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = "447380316463-hc9hadn3fdkko7our9f3mi7um1minaps.apps.googleusercontent.com";
    let isSignup = false;
    let googleReady = false;

    function completeLogin(sessionData) {
      localStorage.setItem("loadagent_session", JSON.stringify({
        isLoggedIn: true,
        ts: Date.now(),
        ...sessionData
      }));
      window.location.href = "index.html";
    }

    function switchTab(mode) {
      isSignup = mode === "signup";
      const signinBtn = document.getElementById("tab-signin");
      const signupBtn = document.getElementById("tab-signup");
      const nameWrap = document.getElementById("name-field-wrap");
      const submitBtn = document.getElementById("submit-auth-btn");
      const subtitle = document.getElementById("auth-subtitle");

      if (isSignup) {
        signupBtn.className = "py-2 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 transition";
        signinBtn.className = "py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
        nameWrap.classList.remove("hidden");
        submitBtn.textContent = "Create Account & Continue";
        subtitle.textContent = "Create your LoadAgent-AI account";
      } else {
        signinBtn.className = "py-2 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 transition";
        signupBtn.className = "py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
        nameWrap.classList.add("hidden");
        submitBtn.textContent = "Sign In to Dashboard";
        subtitle.textContent = "Sign in to your dispatching workspace";
      }
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById("user-email").value.trim();
      const pass = document.getElementById("user-pass").value.trim();
      const nameInput = document.getElementById("user-name").value.trim();

      if (!email || !pass) {
        alert("Please enter both email and password.");
        return;
      }

      completeLogin({
        provider: isSignup ? "signup" : "email",
        email,
        name: nameInput || email.split("@")[0]
      });
    }

    function demoLogin() {
      completeLogin({
        provider: "demo",
        email: "demo@loadagent-ai.com",
        name: "Demo Dispatcher"
      });
    }

    function decodeJwtPayload(token) {
      const base64Url = token.split(".")[1];
      const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
      const jsonPayload = decodeURIComponent(
        atob(base64)
          .split("")
          .map((c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
          .join("")
      );
      return JSON.parse(jsonPayload);
    }

    function handleGoogleResponse(response) {
      try {
        const payload = decodeJwtPayload(response.credential);
        completeLogin({
          provider: "google",
          email: payload.email || "",
          name: payload.name || "Google User",
          picture: payload.picture || ""
        });
      } catch (err) {
        console.error("Google credential error:", err);
        alert("Could not complete Google Sign-In. Please try again.");
      }
    }

    function initGoogleSignIn() {
      if (googleReady) return true;
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleGoogleResponse
        });
        googleReady = true;
        return true;
      }
      return false;
    }

    document.addEventListener("DOMContentLoaded", () => {
      initGoogleSignIn();

      const googleBtn = document.getElementById("google-auth-btn");
      if (googleBtn) {
        googleBtn.addEventListener("click", () => {
          if (initGoogleSignIn()) {
            google.accounts.id.prompt();
            return;
          }

          let tries = 0;
          const interval = setInterval(() => {
            tries++;
            if (initGoogleSignIn()) {
              clearInterval(interval);
              google.accounts.id.prompt();
            } else if (tries >= 35) {
              clearInterval(interval);
              alert("Google Sign-In did not load in time. Check your connection or browser script blocker.");
            }
          }, 100);
        });
      }
    });
  </script>
</body>
  </html>
